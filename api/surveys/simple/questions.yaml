questions:
  - id: name
    type: short-text
    label: What is your name?

  - id: employment
    type: single-choice
    label: Are you currently employed?
    options:
      - yes
      - no

  - id: employer
    type: short-text
    label: Who employs you, {{ name }}?
    visible_if:
      question: employment
      equals: yes

  - id: interests
    type: multiple-choice
    label: Which technologies do you use?
    description: Select every technology you use regularly.
    validation:
      min: 1
      max: 3
    options:
      - Go
      - Rust
      - TypeScript

  - id: go_experience
    type: long-text
    label: Tell us about your Go experience, {{ name }}.
    visible_if:
      question: interests
      contains: Go

  - id: satisfaction
    type: rating
    label: How satisfied are you with your current developer tooling?
    min: 1
    max: 5

  - id: satisfaction_feedback
    type: long-text
    label: What could improve your tooling experience?
    visible_if:
      all:
        - question: satisfaction
          less_than_or_equal: 3
        - question: employment
          equals: yes

  - id: contact
    type: yes-no
    label: May we contact you about your responses, {{ name }}?

  - id: email
    type: email
    label: What is the best email address for you?
    visible_if:
      question: contact
      equals: true
